<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PharmaPay — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Manrope', '-apple-system', 'SF Pro Display', 'system-ui', 'sans-serif'] },
          colors: {
            ink: { 900: '#0F1424', 700: '#2A2F40', 500: '#5A6173', 400: '#9098A6', 300: '#C2C7D2' },
            paper: { DEFAULT: '#F4F6FA', card: '#FFFFFF', input: '#F2F4F8' },
            brand: {
              blue: { 700: '#1F1FCC', 600: '#2A2BE2', 500: '#3F47F0', 400: '#5560FB', 300: '#8189FF', 200: '#C9CCFF', 100: '#E8EAFE' },
              green: { 600: '#16C97A', 500: '#21D17A', 400: '#3DCDA2' },
              warn: '#F1B416', trophy: '#F4B73A',
            },
          },
          boxShadow: {
            card: '0 1px 2px rgba(15,20,36,0.04), 0 4px 16px rgba(15,20,36,0.06)',
            elevated: '0 4px 8px rgba(15,20,36,0.06), 0 12px 32px rgba(15,20,36,0.10)',
            fab: '0 8px 20px rgba(22,201,122,0.35)',
            navTop: '0 -2px 12px rgba(15,20,36,0.05)',
          },
          borderRadius: { '3xl': '28px' },
        },
      },
    };
  </script>
  <style>
    html, body, #root { height: 100%; margin: 0; background: #0c0d18; }
    body { font-family: 'Manrope', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* PharmaPay logo */
    .logo { font-weight: 800; letter-spacing: -0.02em; font-size: 26px; line-height: 1; }
    .logo .pay { color: #2A2BE2; }
    /* primary green header gradients (was blue, now green per brand-swap) */
    .grad-welcome { background: linear-gradient(180deg, #3DCDA2 0%, #21D17A 50%, #16A65C 100%); }
    .grad-blueHead { background: linear-gradient(180deg, #21D17A 0%, #16A65C 100%); }
    .grad-receipt { background: linear-gradient(150deg, #3DCDA2 0%, #21D17A 50%, #16A65C 100%); }
    /* screen transition */
    .screen { animation: fade .25s ease both; }
    @keyframes fade { from { transform: translateY(6px) } to { transform: none } }
    .slide-up { /* no entry animation — keeps screenshot rendering deterministic */ }
    /* Promo outline — was green, now blue */
    .promo-outline { box-shadow: 0 0 0 2px #2A2BE2 inset, 0 1px 2px rgba(15,20,36,0.04), 0 4px 16px rgba(15,20,36,0.06); }
    /* Light gloss for soft-on-blue pills */
    .glass-pill {
      background: rgba(255,255,255,0.16);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18), inset 0 1px 0 rgba(255,255,255,0.22);
    }
    /* Tab-bar arc cutout */
    .navArc {
      mask: radial-gradient(circle 40px at 50% -8px, transparent 40px, #000 41px);
      -webkit-mask: radial-gradient(circle 40px at 50% -8px, transparent 40px, #000 41px);
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="src/icons.jsx"></script>
  <script type="text/babel" src="src/data.jsx"></script>
  <script type="text/babel" src="src/ui.jsx"></script>
  <script type="text/babel" src="src/screens/welcome.jsx"></script>
  <script type="text/babel" src="src/screens/auth.jsx"></script>
  <script type="text/babel" src="src/screens/home.jsx"></script>
  <script type="text/babel" src="src/screens/upload.jsx"></script>
  <script type="text/babel" src="src/screens/profile.jsx"></script>
  <script type="text/babel" src="src/screens/training.jsx"></script>
  <script type="text/babel" src="src/app.jsx"></script>
</body>
</html>
