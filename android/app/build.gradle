plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Загружаем release-keystore параметры из android/key.properties, если файл есть.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseSigningKeys = ["keyAlias", "keyPassword", "storeFile", "storePassword"]
def releaseSigningReady = keystorePropertiesFile.exists() &&
    releaseSigningKeys.every { key -> keystoreProperties[key]?.toString()?.trim() }
def releaseRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase(Locale.ROOT).contains("release")
}
if (releaseRequested && !releaseSigningReady) {
    throw new GradleException(
        "Release signing is not configured. Provide android/key.properties and a private release keystore; " +
        "debug-key fallback is forbidden."
    )
}

android {
    namespace = "kz.pharmacy.app"
    // flutter_secure_storage 10.x compiles against API 36. compileSdk is
    // backward-compatible and independent from the runtime target/min SDK.
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "kz.pharmacy.app"
        // flutter_secure_storage (persist токенов) требует Android 6.0+ (API 23).
        // Дефолтный flutter.minSdkVersion (21) ронял release-сборку APK.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Production artifacts must never be signed with the shared debug key.
            if (releaseSigningReady) signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
