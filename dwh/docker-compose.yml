services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8}
    container_name: epharm-dwh-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-dwh_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me-before-use}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  clickhouse_data:
