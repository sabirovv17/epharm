# Прод-стек Epharm «всё одной командой».
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# Поднимает и держит ВСЁ ядро на одном сервере: Postgres + Redis + MinIO + backend +
# admin-frontend. У всех сервисов restart: always + healthcheck + depends_on(service_healthy),
# поэтому стек сам переживает краш контейнера и перезагрузку сервера (нужен docker с
# автозапуском при boot: `systemctl enable docker`).
#
# Клиенты (кассы /api/posm, телефоны /api/mobile, менеджеры — админка) ходят на этот сервер.
# TLS/домен (epharm.inkar.kz) — отдельным reverse-proxy (Caddy) поверх; см. RUNBOOK.
# Секреты — в .env.prod (НЕ коммитится); шаблон — .env.prod.example.

services:
  postgres:
    image: postgres:16-alpine
    container_name: epharm-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-epharm}
      POSTGRES_USER: ${POSTGRES_USER:-epharm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-epharm} -d ${POSTGRES_DB:-epharm}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: epharm-redis
    restart: always
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: epharm-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-epharm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}
      # Metrics stay private on the Docker network; Caddy never routes /minio/*.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    expose:
      - '9000' # S3 API — наружу не публикуем, отдаётся через Caddy (s3-домен, TLS)
    ports:
      # Консоль администрирования MinIO — ТОЛЬКО на localhost сервера (доступ через
      # SSH-туннель / VPN). Не публикуем на 0.0.0.0, чтобы root-консоль не светилась в сеть.
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: epharm-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-epharm} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/epharm-receipts &&
      mc anonymous set download local/epharm-receipts &&
      echo 'MinIO bucket epharm-receipts ready'
      "
    restart: 'no'

  backend:
    image: epharm/backend:${RELEASE_ID:-dev}
    build:
      context: ./admin-panel/backend
      args:
        RELEASE_ID: ${RELEASE_ID:-dev}
        RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
    container_name: epharm-backend
    restart: always
    # JVM в контейнере: ограничиваем память, чтобы backend не съел весь RAM сервера
    # (7 ГБ на всех сервисах). MaxRAMPercentage=65 от mem_limit → heap ~1.3 ГБ.
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_ENVIRONMENT: production
      RELEASE_ID: ${RELEASE_ID:-dev}
      RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
      SENTRY_DSN: ${SENTRY_BACKEND_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      # Heap relative к mem_limit контейнера (см. mem_limit: 2g выше).
      JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=65.0'
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-epharm}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-epharm}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: '6379'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (min 256-bit) in .env.prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      # SDK ходит на MinIO внутри сети…
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # …а ссылки на фото для браузера строятся по внешнему адресу (через Caddy, https).
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?set S3_PUBLIC_URL=https://<S3_DOMAIN> in .env.prod}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-epharm}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # ВАЖНО для прода: выключить dev-OTP (иначе код входа всегда 5445).
      OTP_DEV_MODE: ${OTP_DEV_MODE:-false}
      # Daribar = внешний полный OTP-цикл из Combined API; p1sms = локальный код + доставка.
      OTP_PROVIDER: ${OTP_PROVIDER:-daribar}
      DARIBAR_OTP_BASE_URL: ${DARIBAR_OTP_BASE_URL:-https://prod-backoffice.daribar.com}
      DARIBAR_OTP_TIMEOUT_MS: ${DARIBAR_OTP_TIMEOUT_MS:-10000}
      # SMS-провайдер p1sms.kz: ключ ПУСТ → SMS не уходят (лог-заглушка). Канал digit/char,
      # sender нужен только для char. Эти поля используются лишь при OTP_PROVIDER=p1sms.
      P1SMS_API_KEY: ${P1SMS_API_KEY:-}
      P1SMS_CHANNEL: ${P1SMS_CHANNEL:-digit}
      P1SMS_SENDER: ${P1SMS_SENDER:-}
      # Used only while the explicitly enabled legacy enrollment window is open.
      POSM_DEVICE_KEY: ${POSM_DEVICE_KEY:-legacy-enrollment-disabled}
      POSM_LEGACY_DEVICE_KEY_ENABLED: ${POSM_LEGACY_DEVICE_KEY_ENABLED:-false}
      POSM_UPDATE_PUBLIC_KEY_SPKI: ${POSM_UPDATE_PUBLIC_KEY_SPKI:?set the pinned POSM update public key}
      MERCH_TASKS_ENABLED: ${MERCH_TASKS_ENABLED:-false}
      MERCH_TASKS_BASE_URL: ${MERCH_TASKS_BASE_URL:-}
      MERCH_TASKS_INTEGRATION_KEY: ${MERCH_TASKS_INTEGRATION_KEY:-}
      MERCH_TASKS_TIMEOUT_MS: ${MERCH_TASKS_TIMEOUT_MS:-7000}
      FULFILLMENT_ENABLED: ${FULFILLMENT_ENABLED:-false}
      FULFILLMENT_SHARED_SECRET: ${FULFILLMENT_SHARED_SECRET:?set FULFILLMENT_SHARED_SECRET (32+ random characters)}
      FULFILLMENT_SIGNATURE_SKEW_SECONDS: ${FULFILLMENT_SIGNATURE_SKEW_SECONDS:-300}
      FULFILLMENT_DEVICE_REGISTRATION_ENABLED: ${FULFILLMENT_DEVICE_REGISTRATION_ENABLED:-false}
      FULFILLMENT_TRUSTED_CARD_PAYMENT_AUTHORITIES: ${FULFILLMENT_TRUSTED_CARD_PAYMENT_AUTHORITIES:-}
      # Bootstrap первого admin-аккаунта HQ-консоли (ProdBootstrap, profile=prod).
      # Без них admin_users пуста → в консоль не войти.
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:?set ADMIN_BOOTSTRAP_EMAIL in .env.prod}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?set ADMIN_BOOTSTRAP_PASSWORD in .env.prod}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-HQ Admin}
      ADMIN_BOOTSTRAP_COMPANY: ${ADMIN_BOOTSTRAP_COMPANY:-Inkar}
      # Внешний Medusa-каталог. Пока новый HTTPS-origin не выдан, интеграция
      # отключена и отвечает сразу, не ожидая мёртвый legacy IP. При включении
      # backend валидирует URL/идентификаторы и завершает старт при ошибке.
      MEDUSA_ENABLED: ${MEDUSA_ENABLED:-false}
      MEDUSA_BASE_URL: ${MEDUSA_BASE_URL:-}
      MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:-}
      MEDUSA_SALES_CHANNEL_ID: ${MEDUSA_SALES_CHANNEL_ID:-}
      MEDUSA_REGION_ID: ${MEDUSA_REGION_ID:-}
      MEDUSA_CONNECT_TIMEOUT_MS: ${MEDUSA_CONNECT_TIMEOUT_MS:-2000}
      MEDUSA_READ_TIMEOUT_MS: ${MEDUSA_READ_TIMEOUT_MS:-6000}
    # Наружу не публикуем — доступ только через Caddy (TLS). Внутри сети backend:8080.
    expose:
      - '8080'

  frontend:
    image: epharm/frontend:${RELEASE_ID:-dev}
    build:
      context: ./admin-panel/frontend
      args:
        # Пусто → фронт делает относительные /api запросы, их проксирует nginx на backend.
        VITE_API_BASE_URL: ''
        VITE_RELEASE_ID: ${RELEASE_ID:-dev}
        VITE_RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
        VITE_APP_ENVIRONMENT: production
        VITE_SENTRY_DSN: ${SENTRY_FRONTEND_DSN:-}
        VITE_SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
    container_name: epharm-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    # Наружу не публикуем — доступ только через Caddy (TLS). Внутри сети frontend:80.
    expose:
      - '80'

  # Reverse-proxy + TLS. Порт 8060 — доверенный HTTP-upstream внешнего TLS ingress INKAR.
  caddy:
    image: caddy:2-alpine
    container_name: epharm-caddy
    restart: always
    depends_on:
      - backend
      - frontend
      - minio
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
      - '8060:8060'
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN (напр. epharm.inkar.kz) in .env.prod}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?set ADMIN_DOMAIN (напр. epharm.inkar.kz) in .env.prod}
      S3_DOMAIN: ${S3_DOMAIN:?set S3_DOMAIN (напр. epharm.inkar.kz) in .env.prod}
      MERCH_PORTAL_UPSTREAM: ${MERCH_PORTAL_UPSTREAM:-10.10.1.80:8080}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${TLS_CERT_DIR:-./tls}:/etc/caddy/tls:ro
      - /srv/epharm-downloads:/srv/epharm-downloads:ro
      - caddy_data:/data # служебные данные Caddy (переживают рестарт)
      - caddy_config:/config

  # Optional production observability profile:
  # docker compose --env-file .env.prod --env-file .release.env \
  #   -f docker-compose.prod.yml --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: epharm-prometheus
    restart: always
    profiles: [monitoring]
    depends_on:
      - backend
      - alertmanager
      - postgres-exporter
      - redis-exporter
      - node-exporter
      - cadvisor
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    volumes:
      - ./ops/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: epharm-alertmanager
    restart: always
    profiles: [monitoring]
    environment:
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    entrypoint: ['/bin/sh', '/etc/alertmanager/render-and-run.sh']
    volumes:
      - ./ops/monitoring/alertmanager/render-and-run.sh:/etc/alertmanager/render-and-run.sh:ro
      - alertmanager_data:/alertmanager
    ports:
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: epharm-blackbox-exporter
    restart: always
    profiles: [monitoring]
    command: ['--config.file=/etc/blackbox_exporter/config.yml']
    volumes:
      - ./ops/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: epharm-postgres-exporter
    restart: always
    profiles: [monitoring]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-epharm}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-epharm}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}

  redis-exporter:
    image: oliver006/redis_exporter:v1.77.0
    container_name: epharm-redis-exporter
    restart: always
    profiles: [monitoring]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: epharm-node-exporter
    restart: always
    profiles: [monitoring]
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    pid: host
    volumes:
      - /:/host:ro,rslave
      - ${BACKUP_ROOT:-/var/backups/epharm}/metrics:/var/lib/node_exporter/textfile_collector:ro

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: epharm-cadvisor
    restart: always
    profiles: [monitoring]
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  grafana:
    image: grafana/grafana:12.1.1
    container_name: epharm-grafana
    restart: always
    profiles: [monitoring]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-production}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  alertmanager_data:
  grafana_data:
