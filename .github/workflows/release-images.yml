name: Private PR166 exact-main qualification

"on":
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact reviewed merged main for private qualification only
        required: true
        type: string
      client_version:
        description: Client-only qualification; this workflow never publishes a release
        default: 1.0.86
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: private-pr166-qualification-${{ github.ref }}
  cancel-in-progress: false

env:
  EXACT_COMMIT: ${{ inputs.exact_commit }}
  CLIENT_VERSION: ${{ inputs.client_version }}

jobs:
  private-guard:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'sabirovv17/epharm' && github.ref == 'refs/heads/codex/pr166-qualification-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.guard.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse product changes and mismatched private inputs
        id: guard
        run: python3 .github/qa/pr166-qualify.py guard
      - name: Offline helper contracts
        run: |
          python3 .github/qa/pr166-qualify.py self-test
          python3 -B .github/qa/test_pr166_qualify.py

  display-pilot:
    needs: private-guard
    if: needs.private-guard.outputs.windows == 'true'
    name: private / exact main86 Windows displays and VM preparation
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Require exact main86 official Windows job and both official artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/qa/pr166-qualify.py live-windows
      - name: Parse private PowerShell helpers without executing application code
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem -LiteralPath ./tools/release -File -Filter ci-display-*.ps1)
          $files+=Get-Item -LiteralPath ./.github/qa/pr166-prepare-windows.ps1
          foreach($file in $files){
            $tokens=$null;$parseErrors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors)
            if(@($parseErrors).Count){throw ('PowerShell parse errors in '+$file.Name+': '+($parseErrors.Message -join '; '))}
          }
      - name: Prepare immutable86 runtime, official85 bridge and private VM-only host/fixtures
        shell: powershell
        env:
          PILOT_READ_TOKEN: ${{ github.token }}
        run: |
          ./.github/qa/pr166-prepare-windows.ps1 -CandidateConfig ./.github/qa/pr166-candidate.json -Bench "$env:RUNNER_TEMP/epharm-display-bench" -Proof "$env:RUNNER_TEMP/display-pilot-proof"
      - name: Verify outer CRC, provenance and exact five-file runtime closure for both bridges
        shell: powershell
        run: |
          python .github/qa/pr166-qualify.py local-bridges --main-archive "$env:RUNNER_TEMP/epharm-display-bench/main-artifact.zip" --previous-archive "$env:RUNNER_TEMP/epharm-display-bench/previous-artifact.zip"
      # Early artifacts let the separate owned VM run while this display gate continues.
      - name: Export trusted runtime closure and both independently verified bridges
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr166-private-trusted-runtime86-${{ inputs.exact_commit }}
          path: ${{ runner.temp }}/epharm-display-bench/vm-transfer/
          compression-level: 0
          overwrite: false
          if-no-files-found: error
          retention-days: 7
      - name: Export separate private cross-process host without product DLL
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr166-private-crossprocess-host86-${{ inputs.exact_commit }}
          path: ${{ runner.temp }}/epharm-display-bench/ui-host/
          compression-level: 0
          overwrite: false
          if-no-files-found: error
          retention-days: 7
      - name: Export private9.99.3 recovery fixtures never for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr166-NEVER-PUBLISH-recovery-fixtures-${{ inputs.exact_commit }}
          path: ${{ runner.temp }}/epharm-display-bench/recovery-fixtures/
          overwrite: false
          if-no-files-found: error
          retention-days: 7
      - name: Verify interactive desktop and actual extended displays
        shell: powershell
        run: |
          ./tools/release/ci-display-topology.ps1 -Mode Setup -Output "$env:RUNNER_TEMP/display-pilot-proof/topology" -DriverRoot "$env:RUNNER_TEMP/epharm-display-bench/vdd/usbmmidd_v2"
      - name: Show exact official86 popup and moving video on separate displays
        shell: powershell
        run: |
          ./tools/release/ci-display-render.ps1 -CandidateConfig ./.github/qa/pr166-candidate.json -BridgeRoot "$env:RUNNER_TEMP/epharm-display-bench/main-bridge" -AppRoot "$env:RUNNER_TEMP/epharm-display-bench/runtime" -VideoPath "$env:RUNNER_TEMP/epharm-display-bench/pilot-customer-display.mp4" -Output "$env:RUNNER_TEMP/display-pilot-proof/render"
      - name: Remove only the pilot display device
        if: always()
        shell: powershell
        run: |
          if(Test-Path -LiteralPath "$env:RUNNER_TEMP/display-pilot-proof/topology"){
            ./tools/release/ci-display-topology.ps1 -Mode Cleanup -Output "$env:RUNNER_TEMP/display-pilot-proof/topology" -DriverRoot "$env:RUNNER_TEMP/epharm-display-bench/vdd/usbmmidd_v2"
          }
      - name: Restore temporary runner firewall settings
        if: always()
        shell: powershell
        run: |
          if(Test-Path -LiteralPath "$env:RUNNER_TEMP/epharm-display-bench"){
            ./tools/release/ci-display-pilot-prepare.ps1 -CandidateConfig ./.github/qa/pr166-candidate.json -Mode Cleanup -Output "$env:RUNNER_TEMP/epharm-display-bench" -Proof "$env:RUNNER_TEMP/display-pilot-proof"
          }
      - name: Upload sanitized display and preparation proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr166-display-pilot-proof-${{ github.sha }}
          path: ${{ runner.temp }}/display-pilot-proof/
          if-no-files-found: error
          retention-days: 7
