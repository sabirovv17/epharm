name: Private PR164 exact-main qualification

"on":
  workflow_dispatch:
    inputs:
      exact_commit:
        description: Exact reviewed merged main for private qualification only
        required: true
        type: string
      release_id:
        description: Reviewed server identity; this workflow never publishes a release
        default: v0.2.16
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: private-pr164-qualification-${{ github.ref }}
  cancel-in-progress: false

env:
  EXACT_COMMIT: ${{ inputs.exact_commit }}
  RELEASE_ID: ${{ inputs.release_id }}

jobs:
  private-guard:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'sabirovv17/epharm' && github.ref == 'refs/heads/codex/pr164-qualification-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.guard.outputs.windows }}
      linux: ${{ steps.guard.outputs.linux }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse product changes and mismatched private inputs
        id: guard
        run: python3 .github/qa/pr164-qualify.py guard
      - name: Offline helper contracts
        run: |
          python3 .github/qa/pr164-qualify.py self-test
          python3 -B -m unittest discover -s .github/qa/pr164-linux -p test_contracts.py -v
          node --check .github/qa/pr164-linux/learner-jwt.mjs

  display-pilot:
    needs: private-guard
    if: needs.private-guard.outputs.windows == 'true'
    name: private / exact main85 Windows displays and VM preparation
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Require exact main85 official Windows job and both official artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/qa/pr164-qualify.py live-windows
      - name: Parse private PowerShell helpers without executing application code
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem -LiteralPath ./tools/release -File -Filter ci-display-*.ps1)
          $files+=Get-Item -LiteralPath ./.github/qa/pr164-prepare-windows.ps1
          foreach($file in $files){
            $tokens=$null;$parseErrors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors)
            if(@($parseErrors).Count){throw ('PowerShell parse errors in '+$file.Name+': '+($parseErrors.Message -join '; '))}
          }
      - name: Prepare immutable85 runtime, official84 bridge and private VM-only host/fixtures
        shell: powershell
        env:
          PILOT_READ_TOKEN: ${{ github.token }}
        run: |
          ./.github/qa/pr164-prepare-windows.ps1 -CandidateConfig ./.github/qa/pr164-candidate.json -Bench "$env:RUNNER_TEMP/epharm-display-bench" -Proof "$env:RUNNER_TEMP/display-pilot-proof"
      # Early artifacts let the separate owned VM run while this display gate continues.
      - name: Export trusted runtime closure and both independently verified bridges
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr164-private-trusted-runtime85-${{ inputs.exact_commit }}
          path: ${{ runner.temp }}/epharm-display-bench/vm-transfer/
          compression-level: 0
          overwrite: false
          if-no-files-found: error
          retention-days: 7
      - name: Export separate private cross-process host without product DLL
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr164-private-crossprocess-host85-${{ inputs.exact_commit }}
          path: ${{ runner.temp }}/epharm-display-bench/ui-host/
          compression-level: 0
          overwrite: false
          if-no-files-found: error
          retention-days: 7
      - name: Export private9.99.2 recovery fixtures never for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr164-NEVER-PUBLISH-recovery-fixtures-${{ inputs.exact_commit }}
          path: ${{ runner.temp }}/epharm-display-bench/recovery-fixtures/
          overwrite: false
          if-no-files-found: error
          retention-days: 7
      - name: Verify interactive desktop and actual extended displays
        shell: powershell
        run: |
          ./tools/release/ci-display-topology.ps1 -Mode Setup -Output "$env:RUNNER_TEMP/display-pilot-proof/topology" -DriverRoot "$env:RUNNER_TEMP/epharm-display-bench/vdd/usbmmidd_v2"
      - name: Show exact official85 popup and moving video on separate displays
        shell: powershell
        run: |
          ./tools/release/ci-display-render.ps1 -CandidateConfig ./.github/qa/pr164-candidate.json -BridgeRoot "$env:RUNNER_TEMP/epharm-display-bench/main-bridge" -AppRoot "$env:RUNNER_TEMP/epharm-display-bench/runtime" -VideoPath "$env:RUNNER_TEMP/epharm-display-bench/pilot-customer-display.mp4" -Output "$env:RUNNER_TEMP/display-pilot-proof/render"
      - name: Remove only the pilot display device
        if: always()
        shell: powershell
        run: |
          if(Test-Path -LiteralPath "$env:RUNNER_TEMP/display-pilot-proof/topology"){
            ./tools/release/ci-display-topology.ps1 -Mode Cleanup -Output "$env:RUNNER_TEMP/display-pilot-proof/topology" -DriverRoot "$env:RUNNER_TEMP/epharm-display-bench/vdd/usbmmidd_v2"
          }
      - name: Restore temporary runner firewall settings
        if: always()
        shell: powershell
        run: |
          if(Test-Path -LiteralPath "$env:RUNNER_TEMP/epharm-display-bench"){
            ./tools/release/ci-display-pilot-prepare.ps1 -CandidateConfig ./.github/qa/pr164-candidate.json -Mode Cleanup -Output "$env:RUNNER_TEMP/epharm-display-bench" -Proof "$env:RUNNER_TEMP/display-pilot-proof"
          }
      - name: Upload sanitized display and preparation proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr164-display-pilot-proof-${{ github.sha }}
          path: ${{ runner.temp }}/display-pilot-proof/
          if-no-files-found: error
          retention-days: 7

  isolated-auth-qa:
    needs: private-guard
    if: needs.private-guard.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: private-pr164-official-linux-acceptance
      cancel-in-progress: false
    env:
      QA_SOURCE_ROOT: ${{ github.workspace }}/source
      QA_HARNESS_ROOT: ${{ github.workspace }}/harness/.github/qa/pr164-linux
      CANDIDATE_COMMIT: ${{ inputs.exact_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: harness
          fetch-depth: 0
          persist-credentials: false
      - name: Read root-approved official image coordinates outside frozen helper
        working-directory: harness
        run: python3 .github/qa/pr164-qualify.py linux-config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.exact_commit }}
          path: source
          persist-credentials: false
      - name: Private evidence directory and offline harness contracts
        run: |
          umask 077
          mkdir -m 700 "$QA_PRIVATE_ROOT"
          python3 -B -m unittest discover -s "$QA_HARNESS_ROOT" -p test_contracts.py -v
      - name: Verify official previous and candidate image artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 "$QA_HARNESS_ROOT/fetch-official.py"
      - name: Require full exact current-main PUSH CI and P0
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: source
        run: python3 tools/release/verify-release-source.py "$CANDIDATE_COMMIT"
      - name: Run preserved staff load and distinct learner JWT acceptance
        env:
          ROOT_CANDIDATE_READY: APPROVED_OFFICIAL_CANDIDATE
        run: python3 "$QA_HARNESS_ROOT/run-linux-acceptance.py"
      - name: Reconcile only recorded owned disposable resources
        if: always()
        env:
          ROOT_CANDIDATE_READY: APPROVED_OFFICIAL_CANDIDATE
        run: |
          if [ -f "$QA_PRIVATE_ROOT/assessment.json" ]; then
            python3 "$QA_HARNESS_ROOT/run-linux-acceptance.py" --cleanup-only
          fi
      - name: Upload only sanitized aggregate Linux evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr164-isolated-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr164-isolated-qa/assessment.json
            ${{ runner.temp }}/pr164-isolated-qa/results/rps-*.json
            ${{ runner.temp }}/pr164-isolated-qa/results/learner-jwt-summary.json
            ${{ runner.temp }}/pr164-isolated-qa/artifacts/verified-identities.json
          retention-days: 14
          if-no-files-found: error
