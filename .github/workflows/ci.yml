name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Не запускаем дубли для одной и той же ветки
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Admin frontend (React + Vite + TypeScript)
  # ─────────────────────────────────────────────────────────────────────
  admin-lint:
    name: admin / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-panel/web/package-lock.json
      - run: npm ci
      - run: npm run lint

  admin-typecheck:
    name: admin / typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-panel/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  admin-build:
    name: admin / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-panel/web/package-lock.json
      - run: npm ci
      - run: npm run build

  # admin-test и admin-coverage будут включены как required после добавления Vitest в Этапе 1.

  # ─────────────────────────────────────────────────────────────────────
  # Backend (Kotlin 2.0 + Spring Boot 3.3)
  # ─────────────────────────────────────────────────────────────────────
  backend-build:
    name: backend / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -x test

  backend-test:
    name: backend / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: epharm
          POSTGRES_USER: epharm
          POSTGRES_PASSWORD: epharm_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U epharm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test/
          retention-days: 7

  # backend-coverage (jacoco) — добавим как required в Этапе 3 при появлении сервисных тестов.

  # ─────────────────────────────────────────────────────────────────────
  # Mobile (Flutter) — запускается только если изменён lib/
  # ─────────────────────────────────────────────────────────────────────
  mobile-changes:
    name: mobile / changes detected
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'lib/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'android/**'
              - 'ios/**'

  mobile-analyze:
    name: mobile / analyze
    needs: mobile-changes
    if: needs.mobile-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.x'
      - run: flutter pub get
      - run: flutter analyze

  mobile-test:
    name: mobile / test
    needs: mobile-changes
    if: needs.mobile-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.x'
      - run: flutter pub get
      - run: flutter test || echo "No tests yet — placeholder, добавим в Этапе 6"

  # ─────────────────────────────────────────────────────────────────────
  # Repo-уровневые проверки (PR-only)
  # ─────────────────────────────────────────────────────────────────────
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install commitlint
        run: |
          npm install -g @commitlint/cli@19 @commitlint/config-conventional@19
      - name: Validate PR title (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | npx --no -- commitlint --config commitlint.config.cjs

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
