name: CI

# 'on' в кавычках — YAML 1.1 интерпретирует bare on как boolean True.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  # ────────────────────────────────────────────────────────────────
  # Admin frontend (React 19 + Vite + TS + Tailwind)
  # ────────────────────────────────────────────────────────────────
  frontend-lint:
    name: frontend / lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-panel/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-typecheck:
    name: frontend / typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-panel/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend-test:
    name: frontend / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-panel/frontend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    name: frontend / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-panel/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ────────────────────────────────────────────────────────────────
  # Backend (Kotlin 2.0 + Spring Boot 3.3)
  # ────────────────────────────────────────────────────────────────
  backend-build:
    name: backend / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -x test

  backend-test:
    name: backend / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      # Backend integration tests запускают свой Postgres через Testcontainers — Docker
      # уже доступен в ubuntu-latest, отдельный service не нужен.
      - run: ./gradlew test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: admin-panel/backend/build/reports/tests/test/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────
  # Repo-уровневые проверки (PR-only)
  # ────────────────────────────────────────────────────────────────
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19
      - name: Validate PR title (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx --no -- commitlint --config commitlint.config.cjs
