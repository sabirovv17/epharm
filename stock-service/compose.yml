services:
  stock:
    build: .
    image: epharm-stock-service:local
    container_name: epharm-stock-service
    env_file: .env
    volumes:
      - ${STOCK_HOST_DATA_DIR:-./data}:/app/data
    ports:
      - '127.0.0.1:18080:8080'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.5
    restart: unless-stopped
