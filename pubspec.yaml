name: pharmacy
description: Epharm — Flutter app for pharmacists (bonuses, training, AI exam).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # SVG (Receipt Stamp logo)
  flutter_svg: ^2.0.16

  # Inputs
  mask_text_input_formatter: ^2.9.0
  pinput: ^5.0.1

  # HTTP-клиент для реального backend (Фаза A+: /api/mobile/**). Выбран http (а не dio):
  # уже в кэше/транзитивен, MockClient из package:http/testing.dart даёт тесты без доп. пакетов.
  http: ^1.2.0

  # Открытие внешних ссылок (YouTube video-инструкция, WhatsApp поддержка).
  url_launcher: ^6.3.1

  # Камера для съёмки чеков. Управляет permissions нативно (iOS Info.plist key
  # + Android <uses-permission/> в манифесте). См. claude-notes.md Этап 3.
  camera: ^0.11.0+2

  # Выбор фото из системной галереи как альтернатива камере.
  image_picker: ^1.1.2
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-Variable.ttf
