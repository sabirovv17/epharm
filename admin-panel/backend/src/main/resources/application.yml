spring:
  application:
    name: epharm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 64MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  version: 0.1.0
  cors:
    # comma-separated list of origins, без trailing slash
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-very-long-key-for-hs256-algo-min-256-bits-required}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:epharm}
    secret-key: ${S3_SECRET_KEY:epharm_dev_minio}
    bucket-receipts: epharm-receipts
  otp:
    # dev-fixed OTP, совпадает с моком в lib/features/auth/data/auth_repository.dart.
    # В prod профиле этот ключ не используется — SMS приходит реально.
    dev-fixed: '544544'
  posm:
    # Ключ устройства кассы (Module 2). POSM-клиент шлёт его в заголовке X-Posm-Key.
    # На MVP — общий ключ; в prod каждой кассе выдаётся свой (Stage 4).
    device-key: ${POSM_DEVICE_KEY:dev-posm-key}
