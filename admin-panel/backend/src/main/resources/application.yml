spring:
  application:
    name: epharm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      # Redis здесь используется через StringRedisTemplate, не как repository store.
      # Явное отключение исключает ошибочную проверку всех JPA repository как Redis-кандидатов.
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 64MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENVIRONMENT:development}
      release: ${RELEASE_ID:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s

# Empty DSN disables export while preserving one production-ready integration path.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${APP_ENVIRONMENT:development}
  release: epharm-backend@${RELEASE_ID:dev}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.05}
  send-default-pii: false
  in-app-includes: kz.epharm

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  merch-tasks:
    enabled: ${MERCH_TASKS_ENABLED:false}
    base-url: ${MERCH_TASKS_BASE_URL:}
    integration-key: ${MERCH_TASKS_INTEGRATION_KEY:}
    timeout-ms: ${MERCH_TASKS_TIMEOUT_MS:7000}
  version: ${RELEASE_ID:dev}
  commit: ${RELEASE_COMMIT:unknown}
  # Канонический публичный origin для QR-проверки сертификатов.
  public-base-url: ${APP_PUBLIC_BASE_URL:https://epharm.inkar.kz}
  cors:
    # comma-separated list of origins, без trailing slash
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-very-long-key-for-hs256-algo-min-256-bits-required}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  s3:
    # Внутренний адрес для SDK (PUT/DELETE). В docker — http://minio:9000.
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    # Внешний адрес для ссылок в браузере (фото чеков/слайды). За reverse-proxy —
    # https://s3.epharm.kz. По умолчанию = endpoint (dev: один localhost:9000).
    public-url: ${S3_PUBLIC_URL:${S3_ENDPOINT:http://localhost:9000}}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:epharm}
    secret-key: ${S3_SECRET_KEY:epharm_dev_minio}
    bucket-receipts: epharm-receipts
  otp:
    # dev-mode=true: код входа фармацевта всегда фиксированный (dev-fixed) и возвращается
    # в ответе /sms/request (devCode) для curl/E2E. В prod профиле переопределяется в false,
    # после чего кодом полностью управляет выбранный внешний провайдер.
    dev-mode: ${OTP_DEV_MODE:true}
    # Боевой провайдер: daribar — код генерирует/проверяет внешний gateway; p1sms — ePharm
    # генерирует код локально и передаёт его провайдеру для доставки. В dev-mode выбор
    # игнорируется и используется фиксированный код без внешнего запроса.
    provider: ${OTP_PROVIDER:daribar}
    # dev-fixed OTP, совпадает с моком в lib/features/auth/data/auth_repository.dart.
    dev-fixed: '5445'
    # TTL кода и анти-брутфорс. register-window — окно на /register после verify.
    ttl-seconds: 300
    max-attempts: 5
    register-window-seconds: 900
    # Анти-спам: повторная отправка кода на тот же номер не чаще, чем раз в N секунд
    # (SMS платные). 0 = выключить. Мобилка держит такой же таймер на кнопке resend.
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  sms:
    # Daribar Combined API (`swag.json`): POST /api/v2/sms + POST /api/v2/auth.
    # Секреты SMS-агрегатора находятся внутри Daribar; ePharm и мобильное приложение
    # отправляют только номер/код и никогда не получают ключ агрегатора.
    daribar:
      base-url: ${DARIBAR_OTP_BASE_URL:https://prod-backoffice.daribar.com}
      timeout-ms: ${DARIBAR_OTP_TIMEOUT_MS:10000}
    # Боевой SMS-провайдер p1sms.kz (apiInstruction.pdf). api-key ПУСТ → лог-заглушка
    # допустима только при OTP_DEV_MODE=true либо когда выбран Daribar.
    p1sms:
      base-url: ${P1SMS_BASE_URL:https://admin.p1sms.kz}
      api-key: ${P1SMS_API_KEY:}
      # Канал: digit (цифровой, без имени отправителя) | char (буквенный, нужен
      # зарегистрированный в ЛК sender). Ставим тот, что активирован на аккаунте.
      channel: ${P1SMS_CHANNEL:digit}
      sender: ${P1SMS_SENDER:}
      text-template: 'Код входа ePharm: {code}'
      timeout-ms: 10000
  posm:
    # Ключ устройства кассы (Module 2). POSM-клиент шлёт его в заголовке X-Posm-Key.
    # Переходный fleet-key; production POSM endpoints используют индивидуальные tokens.
    device-key: ${POSM_DEVICE_KEY:dev-posm-key}
    # Transitional fleet credential. Production is fail-closed and accepts only individually
    # provisioned/revocable device tokens; keep true only in dev/tests or a controlled migration.
    legacy-device-key-enabled: ${POSM_LEGACY_DEVICE_KEY_ENABLED:true}
    # Base64 DER SubjectPublicKeyInfo for ECDSA P-256 update-manifest signatures.
    update-manifest-public-key-spki: ${POSM_UPDATE_PUBLIC_KEY_SPKI:}
    # Accepted producers of exact fiscal PDF/PNG metadata. Must match the POSM-side allowlist.
    fiscal-artifact-trusted-sources: ${POSM_FISCAL_ARTIFACT_TRUSTED_SOURCES:standardn-kkm-sdk,ofd-api}
    # Сколько секунд пульс кассы считается «живым» (T4, GET /screens/connected).
    heartbeat-ttl-seconds: ${POSM_HEARTBEAT_TTL:90}
  fulfillment:
    # Orders are deployed dark first, then enabled for a mapped pilot pharmacy.
    enabled: ${FULFILLMENT_ENABLED:false}
    # One secret authenticates the storefront worker and HMACs pickup codes. Rotating it
    # therefore requires an explicit pickup-code migration; never rotate it ad hoc.
    shared-secret: ${FULFILLMENT_SHARED_SECRET:dev-fulfillment-secret-change-me-32-bytes}
    signature-skew-seconds: ${FULFILLMENT_SIGNATURE_SKEW_SECONDS:300}
    # Enrollment uses the legacy fleet key only during an explicitly controlled window.
    # Existing per-device tokens continue to work after this switch is closed.
    device-registration-enabled: ${FULFILLMENT_DEVICE_REGISTRATION_ENABLED:false}
    # Comma-separated server-side payment producers allowed to assert a non-cash
    # payment as paid. Empty is intentionally fail-closed; browser claims remain pending.
    trusted-card-payment-authorities: ${FULFILLMENT_TRUSTED_CARD_PAYMENT_AUTHORITIES:}
  promo:
    # Ежедневный рефреш цен из Medusa (T1). Cron в TZ Asia/Almaty (зафиксирована в коде):
    # 06:00 — перед открытием аптек, чтобы к рабочему дню цены и блок рекомендаций были свежими.
    price-refresh-cron: ${PROMO_PRICE_REFRESH_CRON:0 0 6 * * *}
  analytics:
    # Окно (дни) для агрегации Dashboard/Lift из recommendation_events.
    window-days: ${ANALYTICS_WINDOW_DAYS:90}
    # Ежедневный пересчёт витринных метрик реестра аптек (receipts30d/rulesAccepted).
    metrics-refresh-cron: ${ANALYTICS_METRICS_REFRESH_CRON:0 30 6 * * *}
  medusa:
    # Внешняя витрина inkar.kz на Medusa v2 (Module 3) — источник реального каталога.
    # Бэкенд ходит туда server-to-server и проксирует товары в мобильное приложение
    # (/api/mobile/catalog/*), чтобы publishable-ключ не попадал в бинарь телефона, а
    # телефон общался только с нашим HTTPS.
    #
    # base-url / sales-channel / region / publishable-key — клиентские (не секретные)
    # идентификаторы витрины: ключ Medusa по дизайну публикуемый (как в любом storefront).
    # Интеграция fail-closed: без явного включения каталог немедленно деградирует в
    # пустой ответ. При MEDUSA_ENABLED=true URL и все идентификаторы обязательны;
    # удалённый origin принимается только по HTTPS, иначе приложение не стартует.
    enabled: ${MEDUSA_ENABLED:false}
    base-url: ${MEDUSA_BASE_URL:}
    publishable-key: ${MEDUSA_PUBLISHABLE_KEY:}
    sales-channel-id: ${MEDUSA_SALES_CHANNEL_ID:}
    region-id: ${MEDUSA_REGION_ID:}
    connect-timeout-ms: ${MEDUSA_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${MEDUSA_READ_TIMEOUT_MS:6000}
    # TTL кэша смаппленного каталога (сек). 0 — выключить кэш.
    cache-ttl-seconds: ${MEDUSA_CACHE_TTL:300}
