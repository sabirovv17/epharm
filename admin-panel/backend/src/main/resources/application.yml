spring:
  application:
    name: epharm-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 64MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  version: 0.1.0
  # Канонический публичный origin для QR-проверки сертификатов.
  public-base-url: ${APP_PUBLIC_BASE_URL:https://epharm.inkar.kz}
  cors:
    # comma-separated list of origins, без trailing slash
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-very-long-key-for-hs256-algo-min-256-bits-required}
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  s3:
    # Внутренний адрес для SDK (PUT/DELETE). В docker — http://minio:9000.
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    # Внешний адрес для ссылок в браузере (фото чеков/слайды). За reverse-proxy —
    # https://s3.epharm.kz. По умолчанию = endpoint (dev: один localhost:9000).
    public-url: ${S3_PUBLIC_URL:${S3_ENDPOINT:http://localhost:9000}}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:epharm}
    secret-key: ${S3_SECRET_KEY:epharm_dev_minio}
    bucket-receipts: epharm-receipts
  otp:
    # dev-mode=true: код входа фармацевта всегда фиксированный (dev-fixed) и возвращается
    # в ответе /sms/request (devCode) для curl/E2E. В prod профиле переопределяется в false,
    # после чего кодом полностью управляет выбранный внешний провайдер.
    dev-mode: ${OTP_DEV_MODE:true}
    # Боевой провайдер: daribar — код генерирует/проверяет внешний gateway; p1sms — ePharm
    # генерирует код локально и передаёт его провайдеру для доставки. В dev-mode выбор
    # игнорируется и используется фиксированный код без внешнего запроса.
    provider: ${OTP_PROVIDER:daribar}
    # dev-fixed OTP, совпадает с моком в lib/features/auth/data/auth_repository.dart.
    dev-fixed: '544544'
    # TTL кода и анти-брутфорс. register-window — окно на /register после verify.
    ttl-seconds: 300
    max-attempts: 5
    register-window-seconds: 900
    # Анти-спам: повторная отправка кода на тот же номер не чаще, чем раз в N секунд
    # (SMS платные). 0 = выключить. Мобилка держит такой же таймер на кнопке resend.
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  sms:
    # Daribar Combined API (`swag.json`): POST /api/v2/sms + POST /api/v2/auth.
    # Секреты SMS-агрегатора находятся внутри Daribar; ePharm и мобильное приложение
    # отправляют только номер/код и никогда не получают ключ агрегатора.
    daribar:
      base-url: ${DARIBAR_OTP_BASE_URL:https://backoffice.daribar.com}
      timeout-ms: ${DARIBAR_OTP_TIMEOUT_MS:10000}
    # Боевой SMS-провайдер p1sms.kz (apiInstruction.pdf). api-key ПУСТ → лог-заглушка
    # допустима только при OTP_DEV_MODE=true либо когда выбран Daribar.
    p1sms:
      base-url: ${P1SMS_BASE_URL:https://admin.p1sms.kz}
      api-key: ${P1SMS_API_KEY:}
      # Канал: digit (цифровой, без имени отправителя) | char (буквенный, нужен
      # зарегистрированный в ЛК sender). Ставим тот, что активирован на аккаунте.
      channel: ${P1SMS_CHANNEL:digit}
      sender: ${P1SMS_SENDER:}
      text-template: 'Код входа ePharm: {code}'
      timeout-ms: 10000
  posm:
    # Ключ устройства кассы (Module 2). POSM-клиент шлёт его в заголовке X-Posm-Key.
    # На MVP — общий ключ; в prod каждой кассе выдаётся свой (Stage 4).
    device-key: ${POSM_DEVICE_KEY:dev-posm-key}
    # Сколько секунд пульс кассы считается «живым» (T4, GET /screens/connected).
    heartbeat-ttl-seconds: ${POSM_HEARTBEAT_TTL:90}
  promo:
    # Ежедневный рефреш цен из Medusa (T1). Cron в TZ Asia/Almaty (зафиксирована в коде):
    # 06:00 — перед открытием аптек, чтобы к рабочему дню цены и блок рекомендаций были свежими.
    price-refresh-cron: ${PROMO_PRICE_REFRESH_CRON:0 0 6 * * *}
  analytics:
    # Окно (дни) для агрегации Dashboard/Lift из recommendation_events.
    window-days: ${ANALYTICS_WINDOW_DAYS:90}
    # Ежедневный пересчёт витринных метрик реестра аптек (receipts30d/rulesAccepted).
    metrics-refresh-cron: ${ANALYTICS_METRICS_REFRESH_CRON:0 30 6 * * *}
  medusa:
    # Внешняя витрина inkar.kz на Medusa v2 (Module 3) — источник реального каталога.
    # Бэкенд ходит туда server-to-server и проксирует товары в мобильное приложение
    # (/api/mobile/catalog/*), чтобы publishable-ключ не попадал в бинарь телефона, а
    # телефон общался только с нашим HTTPS (Medusa пока на голом HTTP).
    #
    # base-url / sales-channel / region / publishable-key — клиентские (не секретные)
    # идентификаторы витрины: ключ Medusa по дизайну публикуемый (как в любом storefront).
    # В prod переопределяются env'ом (см. .env.prod.example). Реальные секреты (SSH/admin)
    # из docs/STOREFRONT-CREDENTIALS.md в код НЕ попадают.
    enabled: ${MEDUSA_ENABLED:true}
    base-url: ${MEDUSA_BASE_URL:http://78.140.246.238:9000}
    publishable-key: ${MEDUSA_PUBLISHABLE_KEY:pk_ed9c35a59066b45de7d9e12510468ca27af16b6d0170b0910c03746545da4525}
    sales-channel-id: ${MEDUSA_SALES_CHANNEL_ID:sc_01KRXGQFYXMJN3FD1WJ7S83WME}
    region-id: ${MEDUSA_REGION_ID:reg_01KSBNEH2D4GVJN8EATK79WNSH}
    timeout-ms: ${MEDUSA_TIMEOUT_MS:15000}
    # TTL кэша смаппленного каталога (сек). 0 — выключить кэш.
    cache-ttl-seconds: ${MEDUSA_CACHE_TTL:300}
