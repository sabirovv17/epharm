spring:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: localhost
      port: 6379
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

app:
  public-base-url: http://localhost
  jwt:
    secret: test-secret-key-of-at-least-32-bytes-for-hs256-tests-only-please
    access-ttl-minutes: 15
    refresh-ttl-days: 30
  medusa:
    # В тестах внешний Medusa выключен: MedusaClient.active=false, list-методы отдают
    # пустоту, никаких сетевых вызовов. Маппинг проверяем юнит-тестом со стаб-клиентом.
    enabled: false
    base-url: ''
    publishable-key: ''
    cache-ttl-seconds: 0

logging:
  level:
    kz.epharm: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
