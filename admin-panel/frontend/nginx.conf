# nginx для admin-frontend: SPA + проксирование API на backend (один origin).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip для статики
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → backend (имя сервиса из docker-compose сети)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;   # под загрузку фото/слайдов
    }

    # Хешированные ассеты Vite — кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA-роутинг: всё остальное отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
