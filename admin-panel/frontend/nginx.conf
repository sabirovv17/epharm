# nginx для admin-frontend: SPA + проксирование API на backend (один origin).
server {
    # Только IPv4: фронт доступен исключительно через Caddy по внутренней docker-сети
    # (IPv4). `listen [::]:80` валит nginx, если у контейнера нет IPv6
    # («Address family not supported by protocol») — на bridge-сети без IPv6.
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security-заголовки (на все ответы) ──────────────────────────────────
    # Админка держит JWT в localStorage → защищаемся от clickjacking/MIME-sniffing.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Внутренняя консоль — не индексируем поисковиками.
    add_header X-Robots-Tag "noindex, nofollow" always;
    # CSP: всё со своего origin. style 'unsafe-inline' — под inline-стили React/Tailwind;
    # img https/data — под фото чеков из s3.epharm.kz; frame-ancestors none — анти-iframe.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # gzip для статики
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API → backend (имя сервиса из docker-compose сети)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 64m;   # под загрузку фото/слайдов
    }

    # Хешированные ассеты Vite — кэшируем надолго. `expires` сам ставит
    # Cache-Control: max-age; отдельный add_header НЕ используем, иначе nginx
    # перестанет наследовать server-level security-заголовки на /assets/.
    location /assets/ {
        expires 1y;
    }

    # SPA-роутинг: всё остальное отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
